<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞赛单元日程 Competition Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070b14;
  --surface: #0d1526;
  --surface2: #111d35;
  --border: rgba(255,255,255,0.08);
  --text: #e8edf5;
  --text-muted: #6b7fa0;
  --accent: #00e5ff;
  --gold: #ffd700;
  --radius: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  padding: 28px 32px 20px;
  background: linear-gradient(135deg, #070b14 0%, #0d1a30 100%);
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 120% at 80% 50%, rgba(0,229,255,0.04) 0%, transparent 70%);
  pointer-events: none;
}
.header-top {
  display: flex;
  align-items: flex-end;
  gap: 20px;
  flex-wrap: wrap;
}
.header-title-cn {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(28px, 5vw, 52px);
  letter-spacing: 4px;
  color: var(--accent);
  line-height: 1;
  text-shadow: 0 0 30px rgba(0,229,255,0.3);
}
.header-title-en {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(16px, 2.5vw, 26px);
  letter-spacing: 3px;
  color: var(--text-muted);
  text-transform: uppercase;
  line-height: 1;
}
.header-meta {
  margin-top: 10px;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 1px;
}
.view-toggle {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}
.toggle-btn {
  padding: 8px 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
  text-transform: uppercase;
}
.toggle-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(0,229,255,0.08);
}
.toggle-btn:hover:not(.active) {
  border-color: rgba(255,255,255,0.2);
  color: var(--text);
}

/* ── DESKTOP TABLE VIEW ── */
#desktop-view {
  padding: 0 0 40px;
}
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.schedule-table {
  border-collapse: separate;
  border-spacing: 0;
  width: max-content;
  min-width: 100%;
}
.schedule-table th, .schedule-table td {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

/* Sticky header row */
.schedule-table thead tr {
  position: sticky;
  top: 0;
  z-index: 20;
}
.schedule-table thead th {
  background: #0a1220;
  padding: 0;
  min-width: 110px;
  vertical-align: bottom;
}
.schedule-table thead th.sport-label-header {
  min-width: 180px;
  width: 180px;
  position: sticky;
  left: 0;
  z-index: 30;
  background: #0a1220;
  padding: 16px 16px;
  text-align: left;
}
.date-header {
  padding: 12px 10px 10px;
  text-align: center;
}
.date-header .day-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--text);
  line-height: 1;
}
.date-header .day-week {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 1px;
  margin-top: 2px;
}
.date-header .day-cn {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 1px;
}

/* Sport rows */
.sport-row td {
  vertical-align: top;
  padding: 0;
  background: var(--bg);
  min-height: 60px;
}
.sport-row:hover td {
  background: rgba(255,255,255,0.015);
}
.sport-row td.sport-label {
  position: sticky;
  left: 0;
  z-index: 10;
  background: var(--surface);
  padding: 12px 14px;
  min-width: 180px;
  width: 180px;
  cursor: pointer;
  transition: background 0.2s;
  border-right: 2px solid;
}
.sport-row td.sport-label:hover {
  background: var(--surface2);
}
.sport-label-inner {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sport-name-cn {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.sport-name-en {
  font-size: 10px;
  color: var(--text-muted);
  font-family: 'Space Mono', monospace;
  letter-spacing: 0.5px;
}
.sport-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-top: 4px;
  flex-shrink: 0;
}

/* Cell content */
.cell-inner {
  padding: 6px 8px;
  min-height: 52px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.event-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 7px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.15s;
  line-height: 1.3;
}
.event-pill:hover {
  opacity: 0.85;
  transform: scale(1.02);
}
.pill-phase {
  font-size: 9px;
  opacity: 0.7;
  margin-left: 2px;
}

/* Phase color coding */
.phase-final   { background: rgba(255,215,0,0.18);   color: #ffd700; border-left: 2px solid #ffd700; }
.phase-semi    { background: rgba(251,146,60,0.18);   color: #fb923c; border-left: 2px solid #fb923c; }
.phase-bronze  { background: rgba(180,120,60,0.18);   color: #b4783c; border-left: 2px solid #b4783c; }
.phase-qual    { background: rgba(132,204,22,0.18);   color: #84cc16; border-left: 2px solid #84cc16; }
.phase-group   { background: rgba(148,163,184,0.12);  color: #94a3b8; border-left: 2px solid #475569; }
.phase-default { background: rgba(148,163,184,0.10);  color: #94a3b8; border-left: 2px solid #475569; }

/* Medal dot */
.medal-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--gold);
  flex-shrink: 0;
}

/* empty cell */
.cell-empty {
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cell-dash {
  width: 16px;
  height: 1px;
  background: var(--border);
}

/* ── MOBILE CARD VIEW ── */
#mobile-view {
  display: none;
  padding: 16px;
}
.mobile-day {
  margin-bottom: 24px;
}
.mobile-day-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
  border-bottom: 1px solid var(--border);
}
.mobile-day-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  color: var(--accent);
  line-height: 1;
}
.mobile-day-info {
  display: flex;
  flex-direction: column;
}
.mobile-day-week {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
}
.mobile-sport-card {
  background: var(--surface);
  border-left: 3px solid;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.mobile-sport-card:last-child {
  border-radius: 0 0 var(--radius) var(--radius);
}
.mobile-sport-card:hover {
  background: var(--surface2);
}
.mobile-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.mobile-sport-name {
  font-size: 13px;
  font-weight: 700;
}
.mobile-sport-sub {
  font-size: 10px;
  color: var(--text-muted);
  font-family: 'Space Mono', monospace;
}
.mobile-events {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}
.tap-hint {
  font-size: 10px;
  color: var(--text-muted);
  font-family: 'Space Mono', monospace;
}

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(4,8,20,0.88);
  z-index: 100;
  overflow-y: auto;
  padding: 20px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  animation: fadeIn 0.2s ease;
}
.modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 100%;
  max-width: 900px;
  animation: slideUp 0.25s ease;
  overflow: hidden;
}
@keyframes slideUp { from { transform: translateY(20px); opacity:0 } to { transform:translateY(0); opacity:1 } }
.modal-header {
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.modal-title {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.modal-title-cn {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 3px;
  line-height: 1;
}
.modal-title-en {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 1px;
}
.modal-close {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 6px;
  transition: all 0.15s;
  line-height: 1;
}
.modal-close:hover {
  border-color: rgba(255,255,255,0.3);
  color: var(--text);
}
.modal-body {
  padding: 20px 24px;
  overflow-x: auto;
}
/* Day tabs in modal */
.modal-day-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.day-tab {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: transparent;
  color: var(--text-muted);
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}
.day-tab:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.day-tab.active { border-color: var(--sport-color, var(--accent)); color: var(--sport-color, var(--accent)); background: rgba(0,229,255,0.06); }
/* Detail table */
.detail-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 400px;
}
.detail-table th {
  text-align: left;
  padding: 8px 12px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.detail-table td {
  padding: 9px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  vertical-align: top;
  color: var(--text);
  line-height: 1.4;
}
.detail-table tr:last-child td { border-bottom: none; }
.detail-table tr:hover td { background: rgba(255,255,255,0.02); }
.detail-table td:first-child {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--accent);
  white-space: nowrap;
  width: 80px;
}
.phase-badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 3px;
  font-size: 10px;
  font-family: 'Space Mono', monospace;
}
/* no data */
.no-data {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
  font-size: 13px;
}

/* ── LEGEND ── */
.legend-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-muted);
}
.legend-pill {
  width: 24px; height: 8px;
  border-radius: 2px;
  border-left: 2px solid;
}

@media (max-width: 768px) {
  #desktop-view { display: none !important; }
  #mobile-view { display: block !important; }
  .view-toggle { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="header-title-cn">竞赛总日程</div>
      <div class="header-title-en">Competition Schedule</div>
    </div>
  </div>
  <div class="header-meta">2026 · APR 19 – 30 · 15 SPORTS · SANYA</div>
  <div class="view-toggle">
    <button class="toggle-btn active" onclick="setView('grid')">总览 Grid</button>
    <button class="toggle-btn" onclick="setView('list')">列表 List</button>
  </div>
</header>

<!-- Legend -->
<div class="legend-row">
  <div style="font-family:'Space Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:1px;margin-right:4px;">PHASE:</div>
  <div class="legend-item"><div class="legend-pill phase-final" style="border-left-color:#ffd700"></div>决赛 Final</div>
  <div class="legend-item"><div class="legend-pill phase-semi" style="border-left-color:#fb923c"></div>半决赛 Semi</div>
  <div class="legend-item"><div class="legend-pill phase-qual" style="border-left-color:#84cc16"></div>预赛 Qual</div>
  <div class="legend-item"><div class="legend-pill phase-group" style="border-left-color:#475569"></div>小组赛 Group</div>
  <div class="legend-item"><span style="color:var(--gold);font-size:14px;">●</span> 金牌项目 Gold Medal</div>
  <div class="legend-item" style="margin-left:auto;font-size:10px;font-family:'Space Mono',monospace;cursor:pointer;color:var(--accent)" onclick="document.querySelector('.hint-tip').style.display='none'">点击赛事名称查看详细赛程 ↗</div>
</div>

<!-- DESKTOP GRID VIEW -->
<div id="desktop-view">
<div class="table-wrap">
<table class="schedule-table" id="mainTable">
<thead id="tableHead"></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>

<!-- MOBILE CARD VIEW -->
<div id="mobile-view" id="mobileView"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <div class="modal-title">
        <div class="modal-title-cn" id="modalTitleCN"></div>
        <div class="modal-title-en" id="modalTitleEN"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-day-tabs" id="modalDayTabs"></div>
      <div id="modalContent"></div>
    </div>
  </div>
</div>

const SUMMARY = RAW.summary || {};

function getPhaseClass(phaseStr) {
  if (!phaseStr) return 'phase-default';
  const p = phaseStr.toLowerCase();
  if (p.includes('final') && !p.includes('semi') && !p.includes('quarter') && !p.includes('3') && !p.includes('4')) return 'phase-final';
  if (p.includes('semi') || p.includes('sf')) return 'phase-semi';
  if (p.includes('3') && (p.includes('place') || p.includes('bronze') || p.includes('名'))) return 'phase-bronze';
  if (p.includes('qual') || p.includes('prelim') || p.includes('预赛') || p.includes('resource') || p.includes('repechage')) return 'phase-qual';
  if (p.includes('group') || p.includes('round robin') || p.includes('pool') || p.includes('小组') || p.includes('pool play') || p.includes('round-robin')) return 'phase-group';
  if (p.includes('final')) return 'phase-final';
  return 'phase-default';
}

function getEventSummary(sport, date) {
  const rows = sport.by_date[date];
  if (!rows || !rows.length) return null;
  // Find phase column index
  const headers = sport.headers;
  let phaseIdx = headers.findIndex(h => {
    const en = (h.en || '').toLowerCase();
    return en.includes('phase') || en.includes('阶段');
  });
  // Find event/time column
  let eventIdx = headers.findIndex(h => {
    const en = (h.en || '').toLowerCase();
    return en.includes('event') || en.includes('比赛项目') || en.includes('teams');
  });
  let timeIdx = headers.findIndex(h => {
    const en = (h.en || '').toLowerCase();
    return en.includes('time') || en.includes('start') || en.includes('时间');
  });
  if (timeIdx < 0) timeIdx = 1;

  // Build pills
  const pills = [];
  const phasesSeen = new Set();
  rows.forEach(row => {
    let phase = phaseIdx >= 0 ? (row[phaseIdx] || '') : '';
    // Clean up phase
    phase = phase.split(' / ')[0].trim();
    const cls = getPhaseClass(phase);
    const key = cls + '|' + phase;
    if (!phasesSeen.has(key)) {
      phasesSeen.add(key);
      pills.push({phase, cls});
    }
  });
  const time0 = rows[0][timeIdx];
  return {pills, time0, rowCount: rows.length};
}

// Build desktop table
function buildDesktop() {
  const thead = document.getElementById('tableHead');
  const tbody = document.getElementById('tableBody');

  // Header row
  let headHtml = '<tr><th class="sport-label-header"></th>';
  ALL_DATES.forEach(d => {
    const m = DATE_META[d];
    headHtml += `<th><div class="date-header">
      <div class="day-num">${m.num}</div>
      <div class="day-week">${m.week}</div>
      <div class="day-cn">${m.cn}</div>
    </div></th>`;
  });
  headHtml += '</tr>';
  thead.innerHTML = headHtml;

  // Sport rows
  let bodyHtml = '';
  SPORTS.forEach(sport => {
    const color = sport.color;
    bodyHtml += `<tr class="sport-row">`;
    bodyHtml += `<td class="sport-label" style="border-right-color:${color}" onclick="openModal('${sport.key}')">
      <div class="sport-label-inner">
        <div class="sport-name-cn">${sport.cn}</div>
        <div class="sport-name-en">${sport.en}</div>
        <div class="sport-dot" style="background:${color}"></div>
      </div>
    </td>`;

    ALL_DATES.forEach(d => {
      const hasSport = sport.by_date[d] && sport.by_date[d].length > 0;
      // Check medal from summary
      const summaryKey = sport.key;
      const medals = SUMMARY[summaryKey] && SUMMARY[summaryKey][d];

      if (hasSport) {
        const info = getEventSummary(sport, d);
        bodyHtml += `<td onclick="openModalDay('${sport.key}','${d}')" style="cursor:pointer">
          <div class="cell-inner">`;
        if (medals) {
          bodyHtml += `<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">
            <div class="medal-dot"></div>
            <span style="font-size:10px;color:var(--gold);font-family:'Space Mono',monospace">${medals} GOLD</span>
          </div>`;
        }
        if (info) {
          // Deduplicate pills
          const shown = new Set();
          info.pills.forEach(p => {
            const pkey = p.cls + p.phase.slice(0,20);
            if (!shown.has(pkey)) {
              shown.add(pkey);
              const label = p.phase ? p.phase.split('/')[0].trim().slice(0,22) : '—';
              bodyHtml += `<div class="event-pill ${p.cls}">${label}</div>`;
            }
          });
          if (info.time0) {
            bodyHtml += `<div style="font-size:10px;color:var(--text-muted);font-family:'Space Mono',monospace;margin-top:2px">${info.time0}</div>`;
          }
        }
        bodyHtml += `</div></td>`;
      } else {
        bodyHtml += `<td><div class="cell-empty"><div class="cell-dash"></div></div></td>`;
      }
    });
    bodyHtml += '</tr>';
  });
  tbody.innerHTML = bodyHtml;
}

// Build mobile
function buildMobile() {
  const container = document.getElementById('mobileView') || document.getElementById('mobile-view');
  let html = '';
  ALL_DATES.forEach(d => {
    const m = DATE_META[d];
    const sportsOnDay = SPORTS.filter(s => s.by_date[d] && s.by_date[d].length > 0);
    if (!sportsOnDay.length) return;

    html += `<div class="mobile-day">
      <div class="mobile-day-header">
        <div class="mobile-day-num">${m.num}</div>
        <div class="mobile-day-info">
          <div class="mobile-day-week">${m.week} · ${m.cn}</div>
          <div style="font-size:10px;color:var(--text-muted)">${sportsOnDay.length} sports</div>
        </div>
      </div>`;

    sportsOnDay.forEach(sport => {
      const color = sport.color;
      const medals = SUMMARY[sport.key] && SUMMARY[sport.key][d];
      html += `<div class="mobile-sport-card" style="border-left-color:${color}" onclick="openModalDay('${sport.key}','${d}')">
        <div class="mobile-card-header">
          <div>
            <div class="mobile-sport-name" style="color:${color}">${sport.cn}</div>
            <div class="mobile-sport-sub">${sport.en}</div>
          </div>
          ${medals ? `<div style="font-size:10px;color:var(--gold);font-family:'Space Mono',monospace">🥇 ${medals}</div>` : '<div class="tap-hint">→</div>'}
        </div>
      </div>`;
    });
    html += '</div>';
  });
  if (container) container.innerHTML = html;
}

// Modal logic
let currentSportKey = null;
let currentDay = null;

function openModal(key, day) {
  currentSportKey = key;
  const sport = RAW.sports[key];
  if (!sport) return;

  document.getElementById('modalTitleCN').textContent = sport.cn;
  document.getElementById('modalTitleEN').textContent = sport.en;
  document.getElementById('modalTitleCN').style.color = sport.color;

  // Build day tabs
  const tabs = document.getElementById('modalDayTabs');
  tabs.style.setProperty('--sport-color', sport.color);
  const dates = sport.dates;
  let tabsHtml = '';
  dates.forEach(d => {
    const m = DATE_META[d] || {num: d, week: '', cn: ''};
    const hasMedal = SUMMARY[key] && SUMMARY[key][d];
    tabsHtml += `<button class="day-tab" onclick="selectDay('${key}','${d}')" id="tab-${key}-${d.replace(/-/g,'_')}" style="--sport-color:${sport.color}">
      ${m.num} ${m.cn}${hasMedal ? ' 🥇' : ''}
    </button>`;
  });
  tabs.innerHTML = tabsHtml;

  const targetDay = day || dates[0];
  currentDay = targetDay;
  renderModalContent(key, targetDay);

  // Activate tab
  setTimeout(() => {
    const tabId = `tab-${key}-${targetDay.replace(/-/g,'_')}`;
    const el = document.getElementById(tabId);
    if (el) el.classList.add('active');
  }, 10);

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openModalDay(key, day) {
  openModal(key, day);
}

function selectDay(key, day) {
  currentDay = day;
  // Update tabs
  document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
  const tabId = `tab-${key}-${day.replace(/-/g,'_')}`;
  const el = document.getElementById(tabId);
  if (el) el.classList.add('active');
  renderModalContent(key, day);
}

function renderModalContent(key, day) {
  const sport = RAW.sports[key];
  const rows = sport.by_date[day] || [];
  const headers = sport.headers;
  const content = document.getElementById('modalContent');

  if (!rows.length) {
    content.innerHTML = '<div class="no-data">暂无数据 No data available</div>';
    return;
  }

  // Find key column indices
  let timeIdx = headers.findIndex(h => {
    const en = (h.en || '').toLowerCase();
    return en.includes('time') || en.includes('start');
  });
  if (timeIdx < 0) timeIdx = 1;

  let phaseIdx = headers.findIndex(h => {
    const en = (h.en || '').toLowerCase();
    return en.includes('phase') || en.includes('category');
  });

  // Decide which headers to show (skip date col, skip mostly-empty cols)
  const showCols = [];
  for (let i = 0; i < headers.length; i++) {
    const h = headers[i];
    const label = h.en || h.cn || '';
    if (!label) continue;
    if (i === 0) continue; // date col
    // check if col has any data
    const hasData = rows.some(r => r[i] != null && r[i] !== '');
    if (!hasData) continue;
    showCols.push(i);
  }

  let html = '<table class="detail-table"><thead><tr>';
  showCols.forEach(i => {
    const h = headers[i];
    const label = h.en || '';
    const sublabel = h.cn || '';
    html += `<th><div>${label}</div>${sublabel ? `<div style="opacity:0.6">${sublabel}</div>` : ''}</th>`;
  });
  html += '</tr></thead><tbody>';

  rows.forEach(row => {
    html += '<tr>';
    showCols.forEach(i => {
      let val = row[i] || '—';
      // Style time column
      if (i === timeIdx) {
        html += `<td style="font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);white-space:nowrap">${val}</td>`;
      } else if (i === phaseIdx) {
        const cls = getPhaseClass(val);
        const label = val.split('/')[0].trim();
        html += `<td><span class="phase-badge ${cls}">${label}</span></td>`;
      } else {
        html += `<td>${val}</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  content.innerHTML = html;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOnBg(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function setView(v) {
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  // Both views shown on desktop, this could toggle different layouts
  // For now just visual indicator
}

// Init
buildDesktop();
buildMobile();
</script>
