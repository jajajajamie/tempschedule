<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>竞赛总日程 Competition Schedule</title>
<style>
/* ── RESET & FONT ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font: "Microsoft YaHei","微软雅黑","PingFang SC","苹方","Helvetica Neue",Arial,sans-serif;
  --bg:      #06090f;
  --bg2:     #0b1120;
  --bg3:     #0f1828;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text:    #dde4f0;
  --muted:   #576070;
  --accent:  #00e5ff;
  --r: 6px;
  --sidebar-w: 210px;
  --topbar-h: 52px;
}
html { font-family: var(--font); }
body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* ═══════════════════════════════════════
   LAYOUT — desktop: persistent sidebar
   mobile:  bottom nav + drawer overlay
═══════════════════════════════════════ */

/* Sidebar */
#sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 40;
  transition: transform 0.28s cubic-bezier(.4,0,.2,1);
  will-change: transform;
}

/* Main shifts right when sidebar visible */
#main {
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: margin-left 0.28s cubic-bezier(.4,0,.2,1);
}
body.sidebar-hidden #sidebar { transform: translateX(-100%); }
body.sidebar-hidden #main    { margin-left: 0; }

/* Overlay (mobile only — desktop never shows it) */
#overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 35;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}

/* ── Sidebar content ── */
.sb-logo {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-logo-cn  { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: 2px; line-height: 1.2; }
.sb-logo-en  { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
.sb-logo-sub { font-size: 10px; color: var(--muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }

.sb-section  { padding: 10px 16px 4px; font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; flex-shrink: 0; }

.sb-scroll {
  overflow-y: auto; flex: 1; padding: 0 8px 20px;
  scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
}
.sb-scroll::-webkit-scrollbar { width: 3px; }
.sb-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.nav-overview {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px; border-radius: var(--r);
  border: 1px solid var(--border);
  cursor: pointer; margin: 8px 0 6px;
  transition: all 0.15s;
}
.nav-overview:hover { background: rgba(255,255,255,0.04); }
.nav-overview.active { background: rgba(0,229,255,0.08); border-color: rgba(0,229,255,0.3); }
.nav-overview.active .nov-cn { color: var(--accent); }
.nov-icon { font-size: 13px; }
.nov-cn { font-size: 13px; font-weight: 600; color: var(--text); }
.nov-en { font-size: 9px; color: var(--muted); margin-top: 1px; }

.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: var(--r);
  cursor: pointer; margin-bottom: 1px;
  transition: background 0.12s;
  overflow: hidden;
}
.nav-item:hover { background: rgba(255,255,255,0.05); }
.nav-item.active { background: rgba(255,255,255,0.07); }
.nav-item.active .ni-cn { color: var(--accent); }
.ni-dot  { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.ni-cn   { font-size: 12px; font-weight: 500; }
.ni-en   { font-size: 9px; color: var(--muted); margin-top: 1px; }

/* ── Topbar ── */
#topbar {
  height: var(--topbar-h);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 16px; gap: 10px;
  flex-shrink: 0;
  position: sticky; top: 0; z-index: 25;
}
.tb-menu {
  background: none; border: 1px solid var(--border);
  color: var(--muted); padding: 6px 9px; border-radius: 5px;
  cursor: pointer; font-size: 14px; line-height: 1;
  transition: all 0.15s; flex-shrink: 0;
  font-family: var(--font);
}
.tb-menu:hover { border-color: var(--border2); color: var(--text); }
.tb-title { font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-sub   { font-size: 11px; color: var(--muted); flex-shrink: 0; display: none; }
.pdf-btn  {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 14px; background: rgba(0,229,255,0.08);
  border: 1px solid rgba(0,229,255,0.35); color: var(--accent);
  font-size: 11px; font-weight: 500; cursor: pointer;
  border-radius: 5px; transition: all 0.18s;
  white-space: nowrap; flex-shrink: 0;
  font-family: var(--font);
}
.pdf-btn:hover { background: rgba(0,229,255,0.16); }

/* ── Content ── */
#content { flex: 1; overflow-y: auto; overflow-x: hidden; }

/* ═══════════════════════════════════════
   OVERVIEW PAGE
═══════════════════════════════════════ */
.ov-hdr  { padding: 22px 24px 14px; border-bottom: 1px solid var(--border); }
.ov-cn   { font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: 2px; }
.ov-en   { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin-top: 3px; text-transform: uppercase; }

.legend  {
  display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
  padding: 10px 24px; border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--muted);
}
.leg-item { display: flex; align-items: center; gap: 4px; }
.leg-sw   { width: 16px; height: 6px; border-radius: 2px; border-left: 2px solid; }
.leg-tip  { margin-left: auto; font-size: 10px; color: var(--accent); opacity: 0.7; }

/* Scrollable table */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.sch-table  { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
.sch-table th, .sch-table td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.sch-table thead tr { position: sticky; top: 0; z-index: 12; }
.sch-table thead th { background: #090d1a; padding: 0; }
th.th-sport {
  min-width: 130px; width: 130px; position: sticky; left: 0; z-index: 18;
  background: #090d1a; padding: 12px 12px; text-align: left;
  font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase;
}
.th-date { min-width: 108px; text-align: center; padding: 9px 5px; }
.th-date .td-tag { font-size: 9px; color: var(--muted); letter-spacing: 1px; }
.th-date .td-num { font-size: 18px; font-weight: 700; color: var(--text); line-height: 1.1; }
.th-date .td-cn  { font-size: 10px; color: var(--muted); margin-top: 1px; }

.sport-row td  { background: var(--bg); vertical-align: top; }
.sport-row:hover td { background: rgba(255,255,255,0.015); }
td.td-sport {
  position: sticky; left: 0; z-index: 8;
  background: var(--bg3); min-width: 130px; width: 130px;
  padding: 9px 12px; cursor: pointer;
  border-right: 2px solid; transition: background 0.12s;
}
td.td-sport:hover { background: rgba(255,255,255,0.04); }
.sp-cn2 { font-size: 12px; font-weight: 600; }
.sp-en2 { font-size: 9px; color: var(--muted); margin-top: 2px; }
.sp-dot2{ width: 5px; height: 5px; border-radius: 50%; margin-top: 4px; }

td.td-cell { cursor: pointer; transition: background 0.1s; }
td.td-cell:hover { background: rgba(255,255,255,0.04) !important; }
.ci { padding: 5px 7px; min-height: 46px; display: flex; flex-direction: column; gap: 3px; }
.pill {
  display: block; padding: 2px 6px; border-radius: 2px; font-size: 9px; font-weight: 500;
  border-left: 2px solid; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.p-final { background: rgba(251,191,36,.14); color: #fbbf24; border-left-color: #fbbf24; }
.p-semi  { background: rgba(251,146,60,.14); color: #fb923c; border-left-color: #fb923c; }
.p-qual  { background: rgba(132,204,22,.14); color: #84cc16; border-left-color: #84cc16; }
.p-group { background: rgba(90,106,136,.16); color: #94a3b8; border-left-color: #475569; }
.p-other { background: rgba(90,106,136,.12); color: #7a8fab; border-left-color: #394a62; }
.ci-time { font-size: 9px; color: var(--muted); margin-top: 1px; }
.td-empty { min-height: 46px; display: flex; align-items: center; justify-content: center; }
.td-dash  { width: 12px; height: 1px; background: rgba(255,255,255,0.06); }

/* Sport cards grid */
.cards-sec   { padding: 18px 24px 36px; }
.cards-title { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
.cards-grid  { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px,1fr)); gap: 9px; }
.sport-card  {
  background: var(--bg3); border: 1px solid var(--border);
  border-left: 3px solid; border-radius: var(--r);
  padding: 12px 13px 11px; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  position: relative; overflow: hidden;
}
.sport-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.32); background: var(--bg2); }
.sc-cn2 { font-size: 13px; font-weight: 700; }
.sc-en2 { font-size: 9px; color: var(--muted); margin-top: 2px; }
.sc-pips{ display: flex; flex-wrap: wrap; gap: 2px; margin-top: 7px; }
.sc-pip { font-size: 9px; padding: 1px 4px; border-radius: 2px; background: rgba(255,255,255,0.07); color: var(--muted); }
.sc-arr { position: absolute; right: 10px; top: 10px; font-size: 11px; color: var(--muted); opacity: 0; transition: opacity .15s; }
.sport-card:hover .sc-arr { opacity: 1; }

/* ═══════════════════════════════════════
   SPORT DETAIL PAGE
═══════════════════════════════════════ */
#pg-sport { display: none; }

.sp-hdr {
  padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 14px;
}
.sp-bar  { width: 4px; border-radius: 2px; min-height: 40px; align-self: stretch; flex-shrink: 0; }
.sp-ttl-cn { font-size: 24px; font-weight: 700; line-height: 1.15; }
.sp-ttl-en { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-top: 3px; text-transform: uppercase; }
.sp-venue  { font-size: 11px; color: var(--muted); margin-top: 5px; }

/* Day chips strip */
.day-strip {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.ds-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-right: 4px; flex-shrink: 0; }
.day-chip {
  display: flex; flex-direction: column; align-items: center;
  padding: 5px 9px; border-radius: 5px; border: 1px solid var(--border);
  min-width: 48px; transition: all 0.15s;
}
.day-chip.on  { cursor: pointer; }
.day-chip.on:hover { filter: brightness(1.15); transform: translateY(-1px); }
.day-chip.on.sel { box-shadow: 0 0 0 2px rgba(255,255,255,0.35); transform: translateY(-1px); }
.day-chip.off { opacity: 0.25; cursor: default; }
.dc-num { font-size: 11px; font-weight: 700; line-height: 1; }
.dc-cn  { font-size: 9px;  opacity: 0.75; margin-top: 1px; }
.dc-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.5); margin-top: 3px; }
.day-chip.off .dc-dot { background: var(--muted); }

/* Schedule blocks */
.sp-body   { padding: 18px 24px 40px; }
.day-sec   { display: none; }
.day-sec.vis { display: block; }
.ds-hdr    { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.ds-date   { font-size: 20px; font-weight: 700; }
.ds-info   { font-size: 11px; color: var(--muted); }
.ds-block  {
  background: var(--bg3); border-radius: 8px;
  border: 1px solid var(--border); border-left: 3px solid;
  padding: 14px 18px; font-size: 13px; line-height: 1.9;
  white-space: pre-wrap; word-break: break-word;
}

/* ═══════════════════════════════════════
   BOTTOM NAV — mobile only
═══════════════════════════════════════ */
#bottom-nav { display: none; }

/* ═══════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════ */
@media (min-width: 769px) {
  /* Desktop: sidebar always in-flow, never overlaps */
  #overlay { display: none !important; }
  .tb-sub  { display: block; }
}

@media (max-width: 768px) {
  /* Mobile: sidebar is off-screen by default */
  :root { --topbar-h: 50px; }

  #sidebar {
    transform: translateX(-100%);
    box-shadow: 4px 0 24px rgba(0,0,0,0.5);
  }
  #sidebar.mob-open { transform: translateX(0); }

  /* Main never shifts on mobile — always full width */
  #main { margin-left: 0 !important; }

  /* Overlay shows behind drawer */
  #overlay { display: block; opacity: 0; pointer-events: none; transition: opacity 0.28s; }
  #overlay.vis { opacity: 1; pointer-events: auto; }

  /* Tighter padding on mobile */
  .ov-hdr, .sp-hdr, .day-strip, .sp-body, .cards-sec, .legend { padding-left: 14px; padding-right: 14px; }
  .th-date { min-width: 90px; }
  th.th-sport, td.td-sport { min-width: 110px; width: 110px; }
  .ov-cn { font-size: 20px; }

  /* Sport detail: smaller chips */
  .day-chip { min-width: 42px; padding: 4px 6px; }
  .dc-num  { font-size: 10px; }
  .sp-ttl-cn { font-size: 20px; }
  .ds-block  { font-size: 12px; line-height: 1.75; }
}

@media (max-width: 480px) {
  .cards-grid { grid-template-columns: repeat(2, 1fr); }
  .th-date { min-width: 80px; }
  th.th-sport, td.td-sport { min-width: 100px; width: 100px; }
}

/* ── PRINT ── */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  #sidebar, #topbar, #overlay, #bottom-nav, .cards-sec, .legend .leg-tip, .pdf-btn { display: none !important; }
  body.sidebar-hidden #main, #main { margin-left: 0 !important; }
  #content { overflow: visible !important; }
  #pg-sport { display: none !important; }
  #pg-overview { display: block !important; }
  .table-wrap { overflow: visible !important; }
  .sch-table { width: 100% !important; }
  @page { size: A3 landscape; margin: 5mm; }
  .sch-table th, .sch-table td { font-size: 7px !important; }
  .th-date .td-num { font-size: 11px !important; }
  .ci { padding: 3px 4px !important; min-height: 0 !important; }
  .td-empty { min-height: 14px !important; }
  th.th-sport, td.td-sport { min-width: 75px !important; width: 75px !important; }
  .th-date { min-width: 68px !important; }
}
</style>
</head>
<body>

<!-- Overlay (mobile drawer backdrop) -->
<div id="overlay" onclick="closeSidebar()"></div>

<!-- ── SIDEBAR ── -->
<nav id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-cn">竞赛总日程</div>
    <div class="sb-logo-en">Competition Schedule</div>
    <div class="sb-logo-sub">三亚 · 2026 · APR 21–30</div>
  </div>
  <div style="padding:4px 8px 0">
    <div class="nav-overview active" id="nav-ov" onclick="showOverview()">
      <span class="nov-icon">⊞</span>
      <div><div class="nov-cn">总览</div><div class="nov-en">Overview</div></div>
    </div>
  </div>
  <div class="sb-section">各项目赛程</div>
  <div class="sb-scroll" id="sbNav"></div>
</nav>

<!-- ── MAIN ── -->
<div id="main">

  <!-- Topbar -->
  <div id="topbar">
    <button class="tb-menu" onclick="toggleSidebar()" aria-label="菜单">☰</button>
    <div class="tb-title" id="tbTitle">竞赛总日程</div>
    <div class="tb-sub"  id="tbSub">2026 · 三亚</div>
    <button class="pdf-btn" onclick="doPrint()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      导出 PDF
    </button>
  </div>

  <!-- Scrollable content -->
  <div id="content">

    <!-- ── OVERVIEW ── -->
    <div id="pg-overview">

      <div class="ov-hdr">
        <div class="ov-cn">竞赛总日程</div>
        <div class="ov-en">Competition Schedule · Sanya 2026</div>
      </div>

      <div class="legend">
        <span style="font-size:9px;color:var(--muted);letter-spacing:1px;margin-right:4px">阶段:</span>
        <div class="leg-item"><div class="leg-sw" style="background:rgba(251,191,36,.18);border-left-color:#fbbf24"></div>决赛</div>
        <div class="leg-item"><div class="leg-sw" style="background:rgba(251,146,60,.18);border-left-color:#fb923c"></div>半决赛</div>
        <div class="leg-item"><div class="leg-sw" style="background:rgba(132,204,22,.18);border-left-color:#84cc16"></div>预赛</div>
        <div class="leg-item"><div class="leg-sw" style="background:rgba(90,106,136,.18);border-left-color:#475569"></div>小组赛</div>
        <span class="leg-tip">点击项目名称查看详细赛程 →</span>
      </div>

      <div class="table-wrap">
        <table class="sch-table">
          <thead id="ovTHead"></thead>
          <tbody id="ovTBody"></tbody>
        </table>
      </div>

      <div class="cards-sec">
        <div class="cards-title">所有项目 · All Sports</div>
        <div class="cards-grid" id="cardsGrid"></div>
      </div>
    </div>

    <!-- ── SPORT DETAIL ── -->
    <div id="pg-sport">
      <div class="sp-hdr">
        <div class="sp-bar" id="spBar"></div>
        <div>
          <div class="sp-ttl-cn" id="spCN"></div>
          <div class="sp-ttl-en" id="spEN"></div>
          <div class="sp-venue"  id="spVenue"></div>
        </div>
      </div>
      <div class="day-strip" id="dayStrip"></div>
      <div class="sp-body"  id="spBody"></div>
    </div>

  </div><!-- /content -->

/* ─── helpers ─── */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function phaseClass(t){
  if(!t) return 'p-other';
  const l=t.toLowerCase();
  if((l.includes('决赛')||l.includes('final'))&&!l.includes('半')&&!l.includes('semi')&&!l.includes('四分')&&!l.includes('quarter')&&!l.includes('3')&&!l.includes('铜')&&!l.includes('bronze')) return 'p-final';
  if(l.includes('半决')||l.includes('semi')) return 'p-semi';
  if(l.includes('预赛')||l.includes('qual')||l.includes('prelim')) return 'p-qual';
  if(l.includes('小组')||l.includes('group')||l.includes('pool')||l.includes('循环')||l.includes('round robin')||l.includes('round-robin')) return 'p-group';
  return 'p-other';
}
function pillLabel(cls){ return {p_final:'决赛',p_semi:'半决赛',p_qual:'预赛',p_group:'小组赛',p_other:'赛事'}[cls.replace('-','_')]||'赛事'; }

/* ─── Build overview table ─── */
function buildTable(){
  let h=`<tr><th class="th-sport">项目</th>`;
  ALL_DATES.forEach(d=>{
    const m=DM[d];
    h+=`<th class="th-date"><div class="td-tag">${m.tag}</div><div class="td-num">${m.num}</div><div class="td-cn">${m.week} ${m.cn}</div></th>`;
  });
  document.getElementById('ovTHead').innerHTML=h+'</tr>';

  let b='';
  SPORTS.forEach((s,si)=>{
    b+=`<tr class="sport-row"><td class="td-sport" style="border-right-color:${s.color}" onclick="showSport(${si})">
      <div class="sp-cn2">${s.cn}</div><div class="sp-en2">${s.en}</div>
      <div class="sp-dot2" style="background:${s.color}"></div>
    </td>`;
    ALL_DATES.forEach(d=>{
      const v=s.schedule[d];
      if(v){
        const lines=v.split('\n').map(l=>l.trim()).filter(Boolean);
        const seen=new Set(); let pills='';
        lines.forEach(l=>{ const c=phaseClass(l); if(!seen.has(c)){seen.add(c);pills+=`<span class="pill ${c}">${pillLabel(c)}</span>`;} });
        const tm=v.match(/\d{1,2}[:：]\d{2}/);
        b+=`<td class="td-cell" onclick="showSportDay(${si},'${d}')"><div class="ci">${pills}${tm?`<div class="ci-time">${tm[0]} 起</div>`:''}</div></td>`;
      } else {
        b+=`<td><div class="td-empty"><div class="td-dash"></div></div></td>`;
      }
    });
    b+='</tr>';
  });
  document.getElementById('ovTBody').innerHTML=b;
}

        <div class="ds-info">${m.tag} · ${m.week} ${m.cn}</div>
      </div>
      <div class="ds-block" style="border-left-color:${s.color}">${esc(s.schedule[d])}</div>
    </div>`;
  }).join('');

  // select first or requested day
  const activeDays=ALL_DATES.filter(d=>s.schedule[d]);
  selDay(si, day||activeDays[0]);

  document.getElementById('content').scrollTop=0;
  if(window.innerWidth<=768) closeSidebar();
}

function showSportDay(si,day){ showSport(si,day); }

function selDay(si,day){
  document.querySelectorAll('[id^="chip'+si+'_"]').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('[id^="sec'+si+'_"]').forEach(s=>s.classList.remove('vis'));
  const c=document.getElementById('chip'+si+'_'+day.replace(/-/g,'_'));
  const s=document.getElementById('sec'+si+'_'+day.replace(/-/g,'_'));
  if(c) c.classList.add('sel');
  if(s) s.classList.add('vis');
}

/* ─── Sidebar toggle ─── */
function toggleSidebar(){
  if(window.innerWidth<=768){
    const sb=document.getElementById('sidebar');
    const ov=document.getElementById('overlay');
    if(sb.classList.contains('mob-open')){ closeSidebar(); }
    else { sb.classList.add('mob-open'); ov.classList.add('vis'); }
  } else {
    document.body.classList.toggle('sidebar-hidden');
  }
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('mob-open');
  document.getElementById('overlay').classList.remove('vis');
}

/* ─── Print ─── */
function doPrint(){ showOverview(); setTimeout(()=>window.print(),200); }

/* ─── Keyboard ─── */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSidebar();
});

/* ─── Init ─── */
buildSidebar();
buildTable();
buildCards();
</script>
</body>
</html>
